<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduTrack</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>

<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen">

        <div class="login-container">

            <h1>EduTrack</h1>

            <p>Gestão de alunos</p>

            <form id="login-form">

                <div>
                    <label for="login-usuario">Usuário</label>

                    <input
                        type="text"
                        id="login-usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >
                </div>

                <div>
                    <label for="login-senha">Senha</label>

                    <input
                        type="password"
                        id="login-senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    Entrar
                </button>

                <p id="login-erro"></p>

            </form>

        </div>

    </div>


    <!-- SISTEMA -->
    <div class="app" id="app" style="display: none;">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="logo">
                <h1>EduTrack</h1>
                <span>Gestão de alunos</span>
            </div>

            <nav class="menu">

                <button class="menu-item active" data-page="dashboard">
                    Dashboard
                </button>

                <button class="menu-item" data-page="alunos">
                    Alunos
                </button>

                <button class="menu-item" id="btn-logout">
                    Sair
                </button>

            </nav>

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">

            <header class="topbar">
                <h2 id="page-title">Dashboard</h2>
            </header>

            <section id="content">

                <h3>Bem-vindo ao EduTrack</h3>

                <p>
                    Sistema de gerenciamento de alunos.
                </p>

            </section>

        </main>

    </div>


    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/alunos.js"></script>
    <script src="/js/app.js"></script>

</body>

</html>
